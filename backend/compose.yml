services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pournotes
      POSTGRES_USER: pournotes
      POSTGRES_PASSWORD: pournotes_dev
    ports:
      - "5432:5432"
    volumes:
      - pournotes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pournotes -d pournotes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pournotes-postgres-data: