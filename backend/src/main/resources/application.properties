spring.application.name=pournotes-api

# Load backend/.env when it exists.
# "optional" means Cloud Run will not care that the file does not exist there.
spring.config.import=optional:file:./.env[.properties]


# =========================
# DATABASE
# =========================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


# =========================
# JPA / HIBERNATE
# =========================

# Flyway creates/updates the schema.
# Hibernate ONLY checks that the schema agrees with your entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# =========================
# GOOGLE OAUTH
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}


# =========================
# SERVER
# =========================

# Cloud Run supplies PORT.
# Locally this falls back to 8080.
server.port=${PORT:8080}


# =========================
# SESSION COOKIE
# =========================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}


# =========================
# POURNOTES CONFIG
# =========================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
